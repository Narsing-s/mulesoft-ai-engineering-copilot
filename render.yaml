services:
  - type: web
    name: mulesoft-ai-copilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: AI_MAX_TOKENS
        value: "2048"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: AI_API_KEY
        sync: false

  - type: web
    name: mulesoft-ai-copilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "Static frontend - no build required"
    staticPublishPath: .
